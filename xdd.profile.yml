# xdd.profile.yml — Perfil del repo X-DD raíz
# Este archivo es el perfil por defecto. Los proyectos clientes lo sobreescriben
# con su propio xdd.profile.yml.

profile: custom        # Repo del framework, no es un producto en sí
version: 1

capabilities:
  # Todas las capacidades disponibles como referencia/inventario.
  ux_discovery: true
  feature_flags: true
  product_analytics: true
  release_management: true
  observability: true
  disaster_recovery: true
  finops: true
  onboarding: true
  api_contract: true
  contract_testing: true
  db_migrations: true
  perf_budget: true
  a11y_audit: true
  adrs: true
  i18n: true
  privacy_review: true
  mobile_release: true
  data_pipeline: true
  ml_eval: true
  end_user_docs: true

methodologies:
  # Disciplinas *-Driven activas. El orquestador inyecta la capa de cada una en su
  # fase del pipeline (ver docs/disciplinas/INDEX.md columna executor). Los proyectos
  # cliente declaran SOLO el subconjunto que aplica a su caso de uso; este repo (framework)
  # las lista todas como inventario de referencia.
  #
  # Base (nucleo Constitucion, siempre recomendadas):
  - sdd
  - fdd
  - bdd
  - atdd
  - ddd
  - tdd
  - stdd
  - secdd
  - threat_driven
  # Extendidas (activacion por caso de uso — ver docs/disciplinas/):
  - odd_api          # OpenAPI-Driven        -> api-contract
  - uxdd             # UX-Driven             -> ux-driven (skill nueva)
  - a11ydd           # Accessibility-Driven  -> a11y-audit
  - rdd              # Refactoring-Driven    -> refactor-area
  - pdd              # Performance-Driven    -> perf-budget + tags @performance
  - chaos            # Chaos/Resiliency      -> dr-drill (ext) + sandbox
  - mdd              # Migration-Driven      -> db-migrate
  - cdcdd            # Change Data Capture   -> data-pipeline (ext)
  - esdd             # Event Sourcing        -> event-sourcing (skill nueva)
  - ccdd             # Consumer-Driven Contract -> contract-test
  - apivdd           # API Versioning        -> api-versioning (skill nueva)
  - odd_obs          # Observability-Driven  -> observability-init
  - slodriven        # SLO/SLA-Driven        -> capa declarativa (sub-gate error budget)
  - iodd             # Infrastructure-as-Code -> iac-driven (skill nueva)
  - pipelinedriven   # Pipeline-Driven       -> deploy-prod + rollback
  - compliance       # Compliance-Driven     -> privacy-review (ext)
  - privacydd        # Privacy by Design     -> privacy-review
  - debtbudgetdd     # Tech Debt Budgeting   -> debt-budget (skill nueva)
  - deprecationdd    # Deprecation-Driven    -> dependency-update (ext)
  - add              # Architecture-Driven   -> adr-new
  - eda              # Event-Driven Arch     -> data-pipeline (ext)
  - udd              # Use-Case-Driven       -> use-case-driven (skill nueva)

stacks:
  feature_flags: ""
  analytics: ""
  observability: ""
  ci: ""
  i18n: ""
  cloud: ""
